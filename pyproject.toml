[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skuld"
version = "0.0.1"
description = "Skuld: falsification-driven CI/CD for embodied robot policies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# Lower bounds only for now. A pinned lock (pip freeze or uv lock) is produced
# in G02 after the first resolution inside WSL2 and committed as requirements.lock.txt.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
# The simulator lives in its own environment (.venv-mujoco) per spec.md section 12.
# Listed here only so the version is discoverable; do not install into the app env
# until the adapter boundary is proven.
sim = [
  "mujoco>=3.17",
]

[tool.setuptools.packages.find]
include = ["skuld*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  # fastapi.testclient imports starlette's httpx-based client; harmless for our one health test
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
